name: bench

# Validation only: verifies that all apps install, build, and pass the 13
# checks. DOES NOT publish benchmark results: a shared runner is not a valid
# measurement environment and its numbers are not comparable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize shared/ (byte-for-byte equality)
        run: pnpm shared

      - name: Build all apps
        run: pnpm bench:build

      - name: Install Chromium for mutation and HMR checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Functional verification (13 checks per framework)
        run: pnpm bench:verify --skip-build

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: results/
          retention-days: 7

