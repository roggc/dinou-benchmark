packages:
  - "apps/*"

# Dinou resolves its own dependencies (react-server-dom-webpack, babel, rollup,
# postcss...) from flat node_modules. With pnpm's isolated linker, the Dinou runtime
# cannot find some sibling packages, so workspace projects are installed with the
# "hoisted" linker.
nodeLinker: hoisted

minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - dinou

allowBuilds:
  '@swc/core': true
  esbuild: true
