packages:
  - "apps/*"

# Dinou resuelve sus propias dependencias (react-server-dom-webpack, babel, rollup,
# postcss...) desde node_modules planos. Con el linker aislado de pnpm el runtime
# de Dinou no encuentra algunos paquetes hermanos, así que ambos proyectos se
# instalan con el linker "hoisted".
nodeLinker: hoisted

allowBuilds:
  '@swc/core': true
  esbuild: true
